<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoteFlow - Creer un compte</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="light">
<header>
  <h1><a href="index.html">NoteFlow</a></h1>
  <button class="menu-toggle">☰</button>
  <nav id="navLinks">
    <a href="index.html">Connexion</a>
    <div class="switch">
      <input type="checkbox" id="themeSwitch">
      <label for="themeSwitch" class="slider"></label>
    </div>
  </nav>
</header>

  <main>
    <form action="http://localhost:5000/register" class="form-card" id="registerForm" method="POST">
      <h2 id="h2">Créer un compte</h2>
      <input type="email" name="email" id="email" placeholder="Email" required>
      <input type="text" name="name" id="lastname" placeholder="Nom" required>
      <input type="text" name="firstname" id="firstname" placeholder="Prénom" required>
      <input type="password" name="password" id="password" placeholder="Mot de passe" required>
      <input type="password" id="confirmPassword" placeholder="Confirmer le mot de passe" required>
      <button type="submit" class="btn">S'inscrire</button>
    </form>
  </main>

<button id="helpBtn">?</button>
<div class="help-popup">Besoin d'aide ? Contactez support@noteflow.com</div>

  <script src="script.js"></script>
</body>
</html>
