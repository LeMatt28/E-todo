<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoteFlow - Connexion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><a href="index.html">NoteFlow</a></h1>
  <button class="menu-toggle">☰</button>
  <nav id="navLinks">
      <a href="register.html" class="style-btn"><span class="icon">👤</span>Créer un compte</a>
    <div class="switch">
    <button id="themeToggle" class="style-btn"><span class="icon">🌙</span></button>

    </div>
  </nav>
</header>
<main>
  <form action="http://localhost:5000/login" class="form-card" id="loginForm" method="POST">
    <h2 id="h2">Connexion</h2>
    <input type="email" name="email" id="LogEmail" placeholder="Email" required>
    <input type="password" name="password" id="LogPassword" placeholder="Mot de passe" required>
    <button type="submit" class="btn">Se connecter</button>
  </form>
</main>
<button id="helpBtn">?</button>
<div class="help-popup">Besoin d'aide ? Contactez support@noteflow.com</div>
<footer>
  <div>
    <span>© 2025 NoteFlow &ndash; Tous droits réservés</span>
    &middot;
    <a href="mentions.html" class="footer-link">Mentions légales</a>
    &middot;
    <a href="about.html" class="footer-link">À propos du site</a>
  </div>
  <div class="footer-links">
    <button class="social-btn" onclick="window.open('https://www.linkedin.com/in/membre1/', '_blank')">LinkedIn Membre 1</button>
    <button class="social-btn" onclick="window.open('https://www.linkedin.com/in/membre2/', '_blank')">LinkedIn Membre 2</button>
    <button class="social-btn" onclick="window.open('https://github.com/membre3', '_blank')">GitHub Membre 3</button>
    <button class="social-btn" onclick="window.open('https://github.com/membre4', '_blank')">GitHub Membre 4</button>
  </div>
</footer>
<script src="script.js"></script>
</body>
</html>
