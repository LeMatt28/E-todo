<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoteFlow - Connexion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="light">
<header>
  <h1><a href="index.html" class="logo">NoteFlow</a></h1>
  <button class="menu-toggle">☰</button>
  <nav id="navLinks">
    <a href="register.html">Créer un compte</a>
    <div class="switch">
      <input type="checkbox" id="themeSwitch">
      <label for="themeSwitch" class="slider"></label>
    </div>
  </nav>
</header>

  <main>
    <form action="localhost:5000/login" class="login-form" id="loginForm" method="POST">
      <h2 id="h2">Connexion</h2>
      <input  name="email" type="email" id="email" placeholder="Email" required>
      <input name="password" type="password" id="password" placeholder="Mot de passe" required>
      <div class="remember">
      </div>
      <button type="submit">Se connecter</button>
      <a href="reset.html" class="forgot">Mot de passe oublié ?</a>
    </form>
  </main>

<button id="helpBtn">?</button>
<div class="help-popup">Besoin d'aide ? Contactez support@noteflow.com</div>

  <script src="script.js"></script>
</body>
</html>
