<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoteFlow - Créer un compte</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="light">
<header>
  <h1><a href="index.html">NoteFlow</a></h1>
  <button class="menu-toggle">☰</button>
  <nav id="navLinks">
    <a href="index.html">Connexion</a>
    <div class="switch">
      <input type="checkbox" id="themeSwitch">
      <label for="themeSwitch" class="slider"></label>
    </div>
  </nav>
</header>

<main>
  <form id="registerForm">
    <h2>Créer un compte</h2>
    <input type="email" id="email" name="email" placeholder="Email" required>
    <input type="text" id="lastName" name="lastName" placeholder="Nom" required>
    <input type="text" id="firstName" name="firstName" placeholder="Prénom" required>
    <input type="password" id="password" name="password" placeholder="Mot de passe" required>
    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirmer mot de passe" required>
    <button type="submit">Créer mon compte</button>
  </form>
</main>

<button id="helpBtn">?</button>
<div class="help-popup">Besoin d'aide ? Contactez support@noteflow.com</div>

<script src="script.js"></script>
</body>
</html>
